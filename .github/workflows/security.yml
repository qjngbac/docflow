name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "20 2 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Java dependency audit
        working-directory: docflow
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::notice::未配置 NVD_API_KEY，跳过 OWASP NVD 审计；Maven 依赖仍由 Dependabot 持续检查。"
            exit 0
          fi
          mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=8 -DnvdApiKey="$NVD_API_KEY"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Frontend dependency audit
        working-directory: docflow-web
        run: npm audit --audit-level=high
      - name: Collaboration dependency audit
        working-directory: docflow-collab
        run: npm audit --audit-level=high

  codeql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
