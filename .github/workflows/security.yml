name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "20 2 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Java dependency audit
        working-directory: docflow
        run: mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=8
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Frontend dependency audit
        working-directory: docflow-web
        run: npm audit --audit-level=high
      - name: Collaboration dependency audit
        working-directory: docflow-collab
        run: npm audit --audit-level=high

  codeql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
