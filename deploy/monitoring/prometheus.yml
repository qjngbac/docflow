global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/docflow-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

scrape_configs:
  - job_name: docflow-java
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['127.0.0.1:9091']

  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']

  - job_name: mysql
    static_configs:
      - targets: ['127.0.0.1:9104']

  - job_name: redis
    static_configs:
      - targets: ['127.0.0.1:9121']

  - job_name: docflow-probes
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://127.0.0.1:1235/health
          - https://docflow.example.com/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
