# Copy only the values you need into an external application.yml or provide them as environment variables.
# Never commit real SMTP credentials.
app:
  environment: development
  auth:
    idle-timeout-minutes: 30
    session-days: 7
    remember-days: 30
    touch-interval-seconds: 60
    cookie:
      # Keep false for simple local Postman work. Production should use true behind HTTPS.
      enabled: ${AUTH_COOKIE_ENABLED:false}
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
      access-name: ${AUTH_ACCESS_COOKIE_NAME:DOCFLOW_ACCESS}
      refresh-name: ${AUTH_REFRESH_COOKIE_NAME:DOCFLOW_REFRESH}
      csrf-name: ${AUTH_CSRF_COOKIE_NAME:XSRF-TOKEN}
  security:
    state:
      # Keep false locally. Production should reject requests when shared security counters are unavailable.
      fail-closed: ${SECURITY_STATE_FAIL_CLOSED:false}
    trusted-proxies: ${SECURITY_TRUSTED_PROXIES:127.0.0.1/32,::1/128}
    ip-deny-list: ${SECURITY_IP_DENY_LIST:}
    rate-limit:
      general-per-minute: ${RATE_LIMIT_GENERAL_PER_MINUTE:180}
      auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:30}
      upload-per-minute: ${RATE_LIMIT_UPLOAD_PER_MINUTE:30}
      share-per-minute: ${RATE_LIMIT_SHARE_PER_MINUTE:60}
    login:
      captcha-after-failures: ${LOGIN_CAPTCHA_AFTER_FAILURES:3}
      account-max-failures: ${LOGIN_ACCOUNT_MAX_FAILURES:5}
      ip-max-failures: ${LOGIN_IP_MAX_FAILURES:20}
      observation-minutes: ${LOGIN_FAILURE_OBSERVATION_MINUTES:15}
      account-lock-minutes: ${LOGIN_ACCOUNT_LOCK_MINUTES:15}
      ip-lock-minutes: ${LOGIN_IP_LOCK_MINUTES:30}
      captcha-expire-minutes: ${LOGIN_CAPTCHA_EXPIRE_MINUTES:5}
    malware-scan:
      enabled: ${MALWARE_SCAN_ENABLED:false}
      fail-closed: ${MALWARE_SCAN_FAIL_CLOSED:false}
      host: ${CLAMAV_HOST:127.0.0.1}
      port: ${CLAMAV_PORT:3310}
      timeout-millis: ${CLAMAV_TIMEOUT_MS:10000}
    headers:
      content-security-policy: "${CONTENT_SECURITY_POLICY:default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'}"
  trash:
    retention-days: 30
    cleanup-cron: "0 0 2 * * ?"
  mail:
    enabled: false
    from: no-reply@example.com
  verification:
    debug-code: true
    expire-minutes: 10
    cooldown-seconds: 60
    daily-target-limit: 10
    daily-ip-limit: 30
  crdt:
    admin-url: ${CRDT_ADMIN_URL:http://127.0.0.1:1235}
    admin-secret: ${CRDT_ADMIN_SECRET:replace-with-a-long-random-secret}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/docflow?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:docflow}
    password: ${DB_PASSWORD:replace-with-environment-variable}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-version: 1
    baseline-description: docflow-current-schema
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:10MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:50MB}
  mail:
    host: smtp.example.com
    port: 587
    username: example-user
    password: replace-with-environment-variable
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            enable: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Optional. Configure a CJK-capable font for server-side PDF export.
export:
  font-path: ${EXPORT_FONT_PATH:}

jwt:
  # Use a random value of at least 32 bytes in production.
  secret: ${JWT_SECRET:replace-with-a-long-random-secret-at-least-32-bytes}
  expiration: ${JWT_ACCESS_EXPIRATION_MS:1800000}

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}
  public-access-enabled: ${FILE_PUBLIC_ACCESS_ENABLED:true}
  signing-secret: ${FILE_SIGNING_SECRET:replace-with-a-separate-long-random-secret}
  signed-url-seconds: ${FILE_SIGNED_URL_SECONDS:300}

management:
  server:
    # Keep this on loopback when Prometheus runs on the same host.
    port: ${MANAGEMENT_PORT:9091}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,redis
  metrics:
    tags:
      application: docflow-server
      environment: ${APP_ENV:production}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: ${PROMETHEUS_ENABLED:true}
